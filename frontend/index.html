<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý THPT</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div id="login-view" class="login-wrap">
    <form id="login-form" class="login-card">
      <div class="brand-row">
        <div class="brand-mark">THPT</div>
        <div>
          <h1>Quản lý trường THPT</h1>
          <p>Đăng nhập hệ thống</p>
        </div>
      </div>
      <label>Tài khoản<input id="username" name="username" required autocomplete="username" value="admin"></label>
      <label>Mật khẩu<input id="password" name="password" type="password" required autocomplete="current-password" value="admin123"></label>
      <button class="btn primary" type="submit">Đăng nhập</button>
      <div class="demo-box">
        <strong>Tài khoản demo</strong>
        <div>admin / admin123 (Quản trị)</div>
        <div>gv01 / gv123 (Giáo viên)</div>
        <div>phuhuynh01 / ph123 (Phụ huynh tra cứu điểm)</div>
      </div>
      <p id="login-error" class="error hidden"></p>
    </form>
  </div>

  <div id="app-view" class="layout hidden">
    <aside class="sidebar">
      <div class="brand-row">
        <div class="brand-mark">THPT</div>
        <div>
          <strong id="user-name">User</strong>
          <small id="user-role">Role</small>
        </div>
      </div>
      <nav id="nav"></nav>
      <button id="btn-logout" class="btn ghost logout">Đăng xuất</button>
    </aside>
    <main class="content">
      <header class="topbar">
        <div>
          <h1 id="page-title">Tổng quan</h1>
          <p id="page-desc"></p>
        </div>
        <button id="btn-add" class="btn primary hidden">+ Thêm</button>
      </header>
      <div id="toast" class="toast hidden"></div>
      <section id="view"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modal-title">Form</h2>
        <button type="button" id="modal-close" class="btn ghost">✕</button>
      </div>
      <form id="modal-form" class="form-grid"></form>
      <div class="modal-actions">
        <button type="button" id="modal-cancel" class="btn ghost">Hủy</button>
        <button type="submit" form="modal-form" class="btn primary">Lưu</button>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>

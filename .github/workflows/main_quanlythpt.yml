name: Build and deploy Python app to Azure Web App - quanlythpt

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create venv, install deps, smoke test
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DB: quanlythpt_ci
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          python - <<'PY'
          from app import app
          c = app.test_client()
          assert c.get('/health').status_code == 200, c.get('/health').get_json()
          r = c.post('/api/auth/login', json={'username': 'admin', 'password': 'admin123'})
          assert r.status_code == 200, r.get_json()
          print('smoke ok')
          PY

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            app.py
            api.py
            models.py
            seed.py
            db.py
            application.py
            requirements.txt
            runtime.txt
            startup.txt
            startup.sh
            frontend/
            antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'quanlythpt'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_38B70388F9D147348CBE33F37700CF64 }}

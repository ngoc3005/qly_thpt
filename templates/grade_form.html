{% extends "base.html" %}
{% block title %}{{ 'Sửa' if item else 'Nhập' }} điểm{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card card-form p-4">
      <h1 class="h4 mb-3">{{ 'Sửa' if item else 'Nhập' }} điểm</h1>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Học sinh</label>
          <select class="form-select" name="student_id" required>
            {% for s in students %}
            <option value="{{ s.id }}" {% if item and item.student_id == s.id %}selected{% endif %}>
              {{ s.name }} ({{ s.student_code }})
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Môn học</label>
          <select class="form-select" name="subject_id" required>
            {% for s in subjects %}
            <option value="{{ s.id }}" {% if item and item.subject_id == s.id %}selected{% endif %}>{{ s.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Năm học</label>
          <input class="form-control" name="year" required placeholder="2024-2025" value="{{ item.year if item else '' }}">
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Điểm HK1</label>
            <input class="form-control" type="number" step="0.01" min="0" max="10" name="semester_1_score"
                   value="{{ item.semester_1_score if item and item.semester_1_score is not none else '' }}">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Điểm HK2</label>
            <input class="form-control" type="number" step="0.01" min="0" max="10" name="semester_2_score"
                   value="{{ item.semester_2_score if item and item.semester_2_score is not none else '' }}">
          </div>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary">Lưu</button>
          <a class="btn btn-outline-secondary" href="{{ url_for('grades') }}">Hủy</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

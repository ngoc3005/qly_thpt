{% extends "base.html" %}
{% block title %}Môn học{% endblock %}
{% block content %}
<div class="page-header">
  <h1 class="h3 mb-0">Môn học</h1>
  <a class="btn btn-primary" href="{{ url_for('subject_new') }}">+ Thêm môn</a>
</div>
<div class="card card-form">
  <div class="table-responsive">
    <table class="table table-hover mb-0 align-middle">
      <thead class="table-light">
        <tr>
          <th>#</th>
          <th>Tên môn</th>
          <th>Số tiết / tuần</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        {% for item in items %}
        <tr>
          <td>{{ item.id }}</td>
          <td>{{ item.name }}</td>
          <td>{{ item.so_tiet }}</td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-primary" href="{{ url_for('subject_edit', item_id=item.id) }}">Sửa</a>
            <form class="d-inline" method="post" action="{{ url_for('subject_delete', item_id=item.id) }}" onsubmit="return confirm('Xóa môn học này?')">
              <button class="btn btn-sm btn-outline-danger">Xóa</button>
            </form>
          </td>
        </tr>
        {% else %}
        <tr><td colspan="4" class="text-center text-secondary py-4">Chưa có môn học.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
